name: devsec-lab
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devsec
      POSTGRES_USER: devsec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python -m devsec.setup first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsec -d devsec"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
